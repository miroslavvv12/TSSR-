<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Révisions TSSR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TSSR">
<meta name="theme-color" content="#16191d">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#121417;color:#d6d9dd;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 20px 20px}
.box{max-width:360px;width:100%;text-align:center}
h1{font-size:22px;color:#e8eaed;font-weight:600;margin:0 0 6px}
p{color:#959ca6;font-size:15px;line-height:1.5}
input{font:inherit;font-size:17px;width:100%;box-sizing:border-box;padding:12px;border:1px solid #3a414a;border-radius:10px;background:#0f1113;color:#e8eaed;margin:14px 0 10px;text-align:center;letter-spacing:.5px}
button{font:inherit;font-size:16px;width:100%;padding:12px;border-radius:10px;border:1px solid #4f6a86;background:#2a3a4c;color:#e3edf7;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:22px;color:#e09891;font-size:15px}
.lock{font-size:34px;margin-bottom:8px}
</style>
</head>
<body>
<div class="box" id="box">
 <div class="lock">🔒</div>
 <h1>Révisions TSSR</h1>
 <p id="st">Chargement…</p>
 <form id="f" style="display:none" autocomplete="on">
  <input type="text" name="username" value="tssr" autocomplete="username" style="display:none">
  <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" autocapitalize="off" spellcheck="false">
  <button id="go" type="submit">Déverrouiller</button>
  <p id="msg"></p>
  <p style="font-size:13px">Le mot de passe n'est demandé qu'une fois sur cet appareil.</p>
 </form>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
const S=crypto.subtle, ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='tssr:pk';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
async function load(){
 const [keys,enc]=await Promise.all([fetch('keys.json').then(r=>r.json()),fetch('content.enc').then(r=>r.arrayBuffer())]);
 return {keys,enc:new Uint8Array(enc)};
}
async function openContent(priv,enc){
 const wl=new DataView(enc.buffer).getUint16(0);
 const wrapped=enc.slice(2,2+wl), iv=enc.slice(2+wl,14+wl), ct=enc.slice(14+wl);
 const raw=await S.decrypt({name:'RSA-OAEP'},priv,wrapped);
 const k=await S.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new TextDecoder().decode(await S.decrypt({name:'AES-GCM',iv},k,ct));
}
function show(html){document.open();document.write(html);document.close();}
(async()=>{
 let data;
 try{data=await load()}catch(e){document.getElementById('st').textContent="Impossible de charger l'appli. Ouvre-la une première fois avec Internet.";return}
 const saved=lsGet(KEY);
 if(saved){try{const priv=await S.importKey('jwk',JSON.parse(saved),{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);show(await openContent(priv,data.enc));return}catch(e){}}
 document.getElementById('st').textContent='Entre ton mot de passe.';
 const f=document.getElementById('f');f.style.display='block';document.getElementById('pw').focus();
 f.onsubmit=async ev=>{ev.preventDefault();const b=document.getElementById('go'),m=document.getElementById('msg');b.disabled=true;m.textContent='';b.textContent='Vérification…';
  try{const K=data.keys;
   const base=await S.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value.trim()),'PBKDF2',false,['deriveKey']);
   const kek=await S.deriveKey({name:'PBKDF2',salt:ub(K.salt),iterations:K.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
   const pk8=await S.decrypt({name:'AES-GCM',iv:ub(K.iv)},kek,ub(K.encPriv));
   const priv=await S.importKey('pkcs8',pk8,{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt']);
   lsSet(KEY,JSON.stringify(await S.exportKey('jwk',priv)));
   show(await openContent(priv,data.enc));
  }catch(e){m.textContent='Mot de passe incorrect.';b.disabled=false;b.textContent='Déverrouiller'}};
})();
</script>
</body>
</html>
